name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Ballpark tests
        run: npx vitest run src/ballpark/daybreak-v1-data.test.ts src/ballpark/gameplay.test.ts src/ballpark/telemetry.test.ts
      - name: Ballpark 400-pack audit
        run: npm run audit:ballpark -- --combined --fail-on-blockers --limit=20
      - name: Ballpark reserve audit
        run: npm run audit:ballpark -- --reserve-bank --fail-on-blockers --limit=20
      - name: Ballpark launch-window audit
        run: npm run audit:ballpark -- --launch-window --from=2026-05-21 --days=45 --fail-on-blockers --limit=20
      - name: Build web
        run: npm run build:web
      - name: Preserve previous Pages JS chunks
        run: node scripts/preserve_gh_pages_assets.mjs dist https://mitchrobs.github.io/gameshow/
      - name: SPA fallback for GitHub Pages
        run: cp dist/index.html dist/404.html
      - name: Disable Jekyll
        run: touch dist/.nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
